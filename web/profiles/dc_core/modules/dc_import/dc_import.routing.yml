dc_import.admin_import:
  path: '/admin/content/import'
  defaults:
    _form: '\Drupal\dc_import\Form\ImportForm'
    _title: 'Import Content'
  requirements:
    _permission: 'administer dc_import'

dc_import.api_import:
  path: '/api/dc-import'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::import'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dc_import.api_test:
  path: '/dc-test'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::status'
  requirements:
    _access: 'TRUE'

dc_import.api_status:
  path: '/api/dc-import/status'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::status'
  requirements:
    _access: 'TRUE'

dc_import.api_oauth_credentials:
  path: '/api/dc-import/oauth-credentials'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::getOAuthCredentials'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dc_import.api_mcp_credentials:
  path: '/api/dc-import/mcp-credentials'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::getMcpCredentials'
  requirements:
    _access: 'TRUE'
  methods: [GET]

dc_import.api_set_token:
  path: '/api/dc-import/set-token'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::setToken'
  requirements:
    _access: 'TRUE'
  methods: [POST]

dc_import.api_set_template_info:
  path: '/api/dc-import/set-template-info'
  defaults:
    _controller: '\Drupal\dc_import\Controller\ImportApiController::setTemplateInfo'
  requirements:
    _access: 'TRUE'
  methods: [POST]

# Site Health audit summary — single JSON snapshot of content + module
# inventory consumed by the decoupled.io dashboard's "Drupal" tab. Auth
# via Simple OAuth bearer using the MCP Agent consumer (admin context).
# See decoupled-dashboard/docs/SITE-HEALTH-AUDITS.md for the integration.
dc_import.api_audit_summary:
  path: '/api/dc-import/audit-summary'
  defaults:
    _controller: '\Drupal\dc_import\Controller\AuditSummaryController::summary'
  requirements:
    _permission: 'access content'
    _format: 'json'
  options:
    _auth: ['oauth2']
  methods: [GET]
