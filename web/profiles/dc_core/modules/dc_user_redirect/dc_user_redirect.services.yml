services:
  dc_user_redirect.user_redirect_subscriber:
    class: Drupal\dc_user_redirect\EventSubscriber\UserRedirectSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }

  dc_user_redirect.anonymous_admin_redirect_subscriber:
    class: Drupal\dc_user_redirect\EventSubscriber\AnonymousAdminRedirectSubscriber
    arguments: ['@current_user', '@router.admin_context', '@current_route_match']
    tags:
      - { name: event_subscriber }