name: 'AuditCrawl SEO'
type: module
description: 'Connect your AuditCrawl content-strategy report to Drupal and turn each recommended article into a draft node. Optional premium subscription auto-fills drafts with AI-written content on a schedule.'
package: 'AuditCrawl'
core_version_requirement: ^10.3 || ^11
configure: auditcrawl.schedule
dependencies:
  - drupal:node
  - drupal:user
  - drupal:system
