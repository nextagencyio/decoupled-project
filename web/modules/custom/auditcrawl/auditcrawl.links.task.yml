# Primary tab on /admin/content — puts AuditCrawl as a sibling tab of
# the core Content listing. Drupal renders tabs whenever a base_route
# has more than one local_task link attached; this is the one that
# surfaces our module right next to the node overview.
auditcrawl.content_tab:
  title: 'AuditCrawl'
  route_name: auditcrawl.report
  base_route: system.admin_content
  weight: 10

# Secondary tabs on the AuditCrawl screens — Report / Connect /
# Schedule. Drupal's local-task convention is that secondary tabs
# use `parent_id` (no base_route) pointing at their primary tab's
# YAML key. No module-prefix doubling — just the key as-is.
auditcrawl.report_tab:
  title: 'Report'
  route_name: auditcrawl.report
  parent_id: auditcrawl.content_tab
  weight: 0

auditcrawl.connect_tab:
  title: 'Connect'
  route_name: auditcrawl.connect
  parent_id: auditcrawl.content_tab
  weight: 10

auditcrawl.schedule_tab:
  title: 'Schedule (premium)'
  route_name: auditcrawl.schedule
  parent_id: auditcrawl.content_tab
  weight: 20
