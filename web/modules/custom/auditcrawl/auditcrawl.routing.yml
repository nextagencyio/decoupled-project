# Main landing page — Content Strategy table (or "connect your report"
# nudge when no code is saved). Mirrors the WP plugin's Report page.
auditcrawl.report:
  path: '/admin/content/auditcrawl'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\ReportController::render'
    _title: 'AuditCrawl'
  requirements:
    _permission: 'administer auditcrawl'

# One-time setup — ensures the 'article' content type exists + our
# custom fields are installed. Only reached when setup isn't complete;
# ReportController redirects here in that case.
auditcrawl.setup:
  path: '/admin/content/auditcrawl/setup'
  defaults:
    _form: '\Drupal\auditcrawl\Form\SetupForm'
    _title: 'AuditCrawl setup'
  requirements:
    _permission: 'administer auditcrawl'

# Paste-your-code form. Mirrors the WP plugin's Connect page.
auditcrawl.connect:
  path: '/admin/content/auditcrawl/connect'
  defaults:
    _form: '\Drupal\auditcrawl\Form\ConnectForm'
    _title: 'Connect a report'
  requirements:
    _permission: 'administer auditcrawl'

# Premium scheduling settings. Mirrors the WP plugin's Schedule page.
auditcrawl.schedule:
  path: '/admin/content/auditcrawl/schedule'
  defaults:
    _form: '\Drupal\auditcrawl\Form\ScheduleForm'
    _title: 'Schedule (premium)'
  requirements:
    _permission: 'administer auditcrawl'

# ── AJAX endpoints (called by js/admin.js) ─────────────────────────
# Drupal requires csrf_token on POST endpoints; the client fetches a
# token via drupalSettings and includes it as ?token=... (see admin.js).

auditcrawl.ajax.create_stub:
  path: '/admin/content/auditcrawl/ajax/create-stub'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\AjaxController::createStub'
  methods: [POST]
  requirements:
    _permission: 'administer auditcrawl'
    _csrf_token: 'TRUE'

auditcrawl.ajax.generate_now:
  path: '/admin/content/auditcrawl/ajax/generate-now'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\AjaxController::generateNow'
  methods: [POST]
  requirements:
    _permission: 'administer auditcrawl'
    _csrf_token: 'TRUE'

auditcrawl.ajax.rotate_license:
  path: '/admin/content/auditcrawl/ajax/rotate-license'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\AjaxController::rotateLicense'
  methods: [POST]
  requirements:
    _permission: 'administer auditcrawl'
    _csrf_token: 'TRUE'

auditcrawl.ajax.move_license:
  path: '/admin/content/auditcrawl/ajax/move-license'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\AjaxController::moveLicense'
  methods: [POST]
  requirements:
    _permission: 'administer auditcrawl'
    _csrf_token: 'TRUE'

auditcrawl.ajax.open_portal:
  path: '/admin/content/auditcrawl/ajax/open-portal'
  defaults:
    _controller: '\Drupal\auditcrawl\Controller\AjaxController::openPortal'
  methods: [POST]
  requirements:
    _permission: 'administer auditcrawl'
    _csrf_token: 'TRUE'
