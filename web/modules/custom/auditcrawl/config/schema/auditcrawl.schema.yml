auditcrawl.settings:
  type: config_object
  label: 'AuditCrawl settings'
  mapping:
    api_base:
      type: string
      label: 'AuditCrawl API base URL'
    report_code:
      type: string
      label: 'Report code (AC-XXXXXXX) or magic-link token'
    license_key:
      type: string
      label: 'Premium license key (UUID)'
    stub_node_ids:
      type: sequence
      label: 'Map: strategy item index → Drupal node ID'
      sequence:
        type: integer
