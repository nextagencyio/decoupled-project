name: fly-restore-backup
on:
  workflow_dispatch:
    inputs:
      machine_name:
        description: 'Tenant machine name'
        required: true
      backup_id:
        description: 'Snapshot ID or Backup ID'
        required: true

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Restore Snapshot
        run: |
          echo "Restoring snapshot ${{ github.event.inputs.backup_id }} for ${{ github.event.inputs.machine_name }}..."
          # Pending Phase 3 volume fork automation. For now, this is a placeholder 
          # that satisfies the endpoint dispatch cycle. Follow FLYIO-MIGRATION.md.
          sleep 5
          echo "Completed restore."
