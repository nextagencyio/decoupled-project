name: Rollback Drupal source image

# Manually revert decoupled-drupal-frankenphp to a prior Fly release.
# Useful when an auto-deploy (including a security-update merge) turned
# out to be bad and we need the source app back on a known-good image
# quickly — before tenants start cloning from it.
#
# How it works:
#   1. flyctl releases lists history. You pass the version number of
#      the release you want to return to (e.g. 11 for v11).
#   2. We look up that release's image tag and run
#      flyctl deploy --image <that tag>, which creates a NEW release
#      pointing at the old image. Fly history stays intact.
#   3. The source app is immediately serving the old image, so any
#      tenant provisioned after this point starts from the good copy.
#
# Does NOT roll back existing tenants. If a tenant was deployed with
# the bad image, roll it back individually:
#   flyctl deploy -a tenant-<machineName> --image <tag>
# or wait for the next fleet-update once fly-fleet-deploy.yml lands.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Fly release version number to roll back to (e.g. 11 for v11). See flyctl releases -a decoupled-drupal-frankenphp.'
        required: true
        type: string

concurrency:
  group: deploy-drupal-source
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      TARGET_VERSION: ${{ inputs.version }}
    steps:
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve image tag for target version
        id: resolve
        run: |
          set -euo pipefail
          releases=$(flyctl releases -a decoupled-drupal-frankenphp --json)

          # Find the release whose .Version == inputs.version.
          image=$(echo "$releases" | jq -r --arg v "$TARGET_VERSION" \
            '.[] | select((.Version|tostring) == $v) | (.ImageRef.Repository + ":" + (.ImageRef.Tag // .ImageRef.Digest // ""))' \
            | head -1)

          if [ -z "$image" ] || [ "$image" = ":" ]; then
            echo "::error::Could not find release v${TARGET_VERSION} — check flyctl releases output"
            echo "$releases" | jq -r '.[] | "v\(.Version) \(.Status) \(.CreatedAt) image=\(.ImageRef.Repository):\(.ImageRef.Tag // .ImageRef.Digest // "?")"' | head -20
            exit 1
          fi

          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "::notice::rolling back to v${TARGET_VERSION} (image=${image})"

      - name: Deploy previous image
        run: |
          flyctl deploy -a decoupled-drupal-frankenphp \
            --image "${{ steps.resolve.outputs.image }}" \
            --strategy immediate \
            --wait-timeout 300

      - name: Post-rollback summary
        if: always()
        run: |
          post=$(flyctl releases -a decoupled-drupal-frankenphp --json | jq -r '.[0] | "v\(.Version) status=\(.Status) image=\(.ImageRef.Repository):\(.ImageRef.Tag // .ImageRef.Digest // "?")"')
          echo "::notice::post-rollback release: ${post}"
          echo "If tenants were deployed with the bad image, roll them back individually:"
          echo "  flyctl deploy -a tenant-<machineName> --image ${{ steps.resolve.outputs.image }} --strategy immediate"
