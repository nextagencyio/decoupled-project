; Drupal / Fly runtime php.ini overrides.
;
; The dunglas/frankenphp base image ships with php.ini-production, which
; caps memory_limit at 128M and upload_max_filesize at 2M. Those are too
; tight for Drupal 11 admin pages, config imports, and media uploads.
;
; Loaded from /usr/local/etc/php/conf.d/zz-drupal.ini so it wins against
; anything the base image drops in conf.d earlier.

; Drupal admin/update.php needs headroom; 512M leaves ~500M for Caddy +
; FrankenPHP workers + kernel on a 1GB Fly VM.
memory_limit = 512M

; Long-running operations: config import, recipe apply, drush updatedb.
max_execution_time = 120
max_input_time = 120
max_input_vars = 4000

; Media uploads — match or slightly exceed Drupal's default field limits.
upload_max_filesize = 64M
post_max_size = 64M

; Opcache tuning for Drupal's large codebase (core + contrib).
; 128M keeps all hot files in the shared cache; interned_strings gets
; a bigger buffer so repeated field/route names don't churn.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; FrankenPHP's worker mode benefits from JIT; tracing mode is the
; recommended default for web workloads on PHP 8.3+.
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Production error handling — no display, log to stderr so Fly captures it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Timezone: Drupal will still override per-site, but PHP needs a default.
date.timezone = UTC
